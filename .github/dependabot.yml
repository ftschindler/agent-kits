---
version: 2
updates:
# Bump pinned pre-commit hook SHAs (keeps the frozen revisions current).
- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: "chore(pre-commit)"

# Bump pinned GitHub Actions SHAs.
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: "chore(actions)"

# Bump the drawing engine the excalidraw skill installs. The lock file is the
# pin: scripts/excalidraw.py installs it with `npm ci` and caches by its hash.
- package-ecosystem: npm
  directory: /skills/excalidraw/scripts/engine
  schedule:
    interval: weekly
  commit-message:
    prefix: "chore(excalidraw)"
