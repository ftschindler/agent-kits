[pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "conformance: the repository is shaped the way akit discovers a kit (fast, offline)",
  "scripts: unit tests for the python under .scripts/ and inside the skills (fast, offline)",
  "agent: end-to-end tests that install the kits into a real agent (slow, needs network + node)",
]
